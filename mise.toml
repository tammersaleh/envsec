[tools]
go = "1.27"
# golangci-lint must be built with a Go at least as new as the code. 2.12.2
# cannot read Go 1.27 export data. Rebuild it after a Go bump:
# `mise install --force go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint`.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
# govulncheck must run on the Go above so it scans that standard library.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[tasks.build]
run = "go build -o envsec ./cmd/envsec"

[tasks.test]
run = "go test ./..."

[tasks.check]
description = "Run test, lint, and build (matches pre-push hook)"
depends = ["test", "lint", "build"]

[tasks."test:race"]
run = "go test -race ./..."

[tasks."test:cover"]
run = "go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out -o coverage.html"

[tasks."test:int"]
run = "go test -tags=integration ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.setup-hooks]
description = "Configure git to use .githooks/"
run = "git config core.hooksPath .githooks"

[tasks.fmt]
run = "gofmt -w . && goimports -w ."

[tasks.generate]
run = "go generate ./..."

[tasks.clean]
run = "rm -rf bin/ coverage.out coverage.html"
